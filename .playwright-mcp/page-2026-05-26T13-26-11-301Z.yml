            - heading "Hoài nghi khoa học" [level=3] [ref=e173]
            - paragraph [ref=e174]: Chừng nào AI còn vận hành trên silicon và logic nhị phân, nó vẫn là hệ thống mô phỏng thông tin. Bộ não người gắn với sinh học, hormone, hệ thần kinh và cơ thể sống.
          - article [ref=e175]:
