    - generic [ref=e112]:
      - generic [ref=e114]:
        - paragraph [ref=e115]: Chương 3 / Bản chất của AI
        - heading "Đỉnh Cao Vật Chất Hay Khởi Đầu Ý Thức?" [level=2] [ref=e116]
        - paragraph [ref=e117]: "Triết học Mác - Lênin không phủ nhận cũng không thần thánh hóa máy móc. Ta cần đặt AI vào đúng tọa độ biện chứng: bản thể của AI thuộc về đâu, và phản ánh của AI có đồng nhất với ý thức con người không?"
      - generic [ref=e118]:
        - article [ref=e119]:
          - generic [ref=e120]: "01"
          - heading "Hạ tầng vật lý và kỹ thuật" [level=3] [ref=e121]
          - paragraph [ref=e122]: AI không tồn tại như tinh thần thuần túy. Bản thể của nó là chip silicon, bóng bán dẫn, xung điện nhị phân, kiến trúc máy tính và trung tâm dữ liệu tiêu thụ năng lượng.
        - article [ref=e123]:
          - generic [ref=e124]: "02"
          - heading "Vận động toán học - cơ học cao cấp" [level=3] [ref=e125]
          - paragraph [ref=e126]: Mạng neural và Transformer vận hành bằng phép toán ma trận, tối ưu hóa và xác suất thống kê. Câu trả lời của AI là kết quả tính toán token, chưa phải tự ý thức nội tại.
        - article [ref=e127]:
          - generic [ref=e128]: "03"
          - heading "Phụ thuộc vào giới hạn vật chất" [level=3] [ref=e129]
          - paragraph [ref=e130]: AI phụ thuộc vào điện năng và dữ liệu đầu vào. Thiếu dòng điện, AI biến mất; thiếu dữ liệu, AI chỉ còn là thuật toán rỗng.
      - generic [ref=e131]:
        - generic [ref=e132]: Kết luận biện chứng 1
        - strong [ref=e133]: Xét về bản thể luận, AI là đỉnh cao của sự vận động vật chất do con người định hướng. Nó kéo dài một phần năng lực tư duy của con người, tương tự máy hơi nước từng kéo dài sức mạnh cơ bắp.
