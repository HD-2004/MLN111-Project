            - paragraph [ref=e177]: Triết học Mác không giới hạn hình thức vật chất. Nếu tương lai xuất hiện AI sinh học có tế bào thần kinh sống, hoạt động thực tiễn, tương tác xã hội và tự tiến hóa, một dạng ý thức mới có thể được đặt lại như vấn đề triết học mở.
      - generic [ref=e178]:
        - paragraph [ref=e179]: Kết luận chương 3
        - paragraph [ref=e180]: AI là sản phẩm vĩ đại của ý thức con người tác động trở lại thế giới vật chất.
        - paragraph [ref=e181]: Khẳng định AI hiện nay đã có ý thức độc lập là biểu hiện của chủ nghĩa duy tâm thần bí. Ngược lại, coi tư duy con người chỉ là thuật toán xử lý dữ liệu là sự thụt lùi về chủ nghĩa duy vật tầm thường.
        - paragraph [ref=e182]: Bản lĩnh của con người kỷ nguyên số không phải là sợ AI thay thế, mà là dùng ý thức năng động, đúng đắn để định hướng, quản trị và làm chủ AI phục vụ tiến bộ nhân loại.
