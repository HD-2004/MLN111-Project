        - group [ref=e81]:
          - generic "01 1. Phạm trù Vật chất và lịch sử phát triển" [ref=e82] [cursor=pointer]:
            - generic [ref=e83]: "01"
            - strong [ref=e84]: 1. Phạm trù Vật chất và lịch sử phát triển
          - generic [ref=e85]:
            - article [ref=e86]:
              - 'heading "a. Giai đoạn cổ đại: chủ nghĩa duy vật chất phác" [level=4] [ref=e87]'
              - paragraph [ref=e88]: Ở Hy Lạp, Ấn Độ, Trung Hoa cổ đại, khoa học tự nhiên chưa phân ngành nên nhận thức triết học chủ yếu dựa trên quan sát trực quan sinh động và phỏng đoán thiên tài.
              - paragraph [ref=e89]: "Các nhà tư tưởng đồng nhất vật chất với một hoặc một vài vật thể cụ thể: Thales coi bản nguyên là nước, Anaximenes coi là không khí, Heraclitus coi là lửa, Democritus phát triển thuyết nguyên tử."
              - paragraph [ref=e90]: Ở phương Đông, thuyết Ngũ Hành và Tứ đại giải thích sự vận động của vũ trụ qua các trạng thái chuyển hóa.
              - paragraph [ref=e91]: Hạn chế lịch sử của giai đoạn này là lấy cái riêng, hữu hạn để đồng nhất với toàn bộ thế giới vật chất vô hạn.
            - article [ref=e92]:
              - 'heading "b. Giai đoạn cận đại: chủ nghĩa duy vật siêu hình, cơ giới" [level=4] [ref=e93]'
              - paragraph [ref=e94]: Thế kỷ XVII - XVIII chứng kiến sự thống trị của cơ học cổ điển Newton. Nhiều nhà triết học tiếp tục thừa kế thuyết nguyên tử nhưng chịu ảnh hưởng nặng bởi tư duy cơ học.
              - paragraph [ref=e95]: Họ đồng nhất vật chất với nguyên tử hoặc các thuộc tính cơ học như khối lượng, quán tính, vị trí không gian, từ đó nhìn thế giới như một cỗ máy khổng lồ.
              - paragraph [ref=e96]: Cuối thế kỷ XIX - đầu thế kỷ XX, tia X, phóng xạ và electron chứng minh nguyên tử có thể phân chia, tạo ra cuộc khủng hoảng trong quan niệm cũ về vật chất.
            - article [ref=e97]:
              - 'heading "c. Bước ngoặt vĩ đại: định nghĩa vật chất của V.I. Lênin" [level=4] [ref=e98]'
              - blockquote [ref=e99]: Vật chất là một phạm trù triết học dùng để chỉ thực tại khách quan được đem lại cho con người trong cảm giác, được cảm giác của chúng ta chép lại, chụp lại, phản ánh, và tồn tại không lệ thuộc vào cảm giác.
              - list [ref=e100]:
                - listitem [ref=e101]: "Vật chất là thực tại khách quan: tồn tại độc lập với ý thức, nằm ngoài ý thức."
                - listitem [ref=e102]: "Vật chất đem lại cho con người trong cảm giác: vật chất là nguồn gốc khách quan sinh ra cảm giác và ý thức."
                - listitem [ref=e103]: "Ý thức chép lại, chụp lại, phản ánh: thế giới là khả tri, con người có thể nhận thức và giải mã thế giới khách quan."
        - group [ref=e104]:
          - 'generic "02 2. Phạm trù Ý thức: nguồn gốc và bản chất" [ref=e105] [cursor=pointer]':
            - generic [ref=e106]: "02"
