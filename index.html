<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Một bảo tàng triết học tương tác về vật chất, ý thức và AI."
    />
    <title>Ý Thức Trong Kỷ Nguyên Máy Móc</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%2305070c'/%3E%3Cpath d='M32 8 50 56H14L32 8Z' fill='none' stroke='%23d4a84f' stroke-width='4'/%3E%3Ccircle cx='32' cy='34' r='7' fill='%2363d7ff'/%3E%3C/svg%3E"
    />
    <script data-page-transition-bootstrap>
      (function () {
        const root = document.documentElement;
        root.classList.add("page-transition-enabled");
        try {
          if (sessionStorage.getItem("mln-page-transition") === "1") {
            root.classList.add("page-transition-entering");
            sessionStorage.removeItem("mln-page-transition");
          }
        } catch {}
      })();
    </script>
    <link rel="stylesheet" href="src/styles.css" />
  </head>
  <body>
    <noscript>Website cần JavaScript để chạy các tương tác học tập.</noscript>
    <div id="app"></div>
    <script src="src/data.js" defer></script>
    <script src="src/section2-content.js" defer></script>
    <script src="src/app.js" defer></script>
    <script type="module" src="src/hero-3d.js"></script>
    <script type="module" src="src/section2-gear.js"></script>
    <script src="src/page-transition.js" defer></script>
  </body>
</html>
